    <p class="art-sub">旅游时看见母亲，走近发现她背后站着一个我</p>
    <p class="art-meta"><span>2023-09-27</span><span>梦境</span><span>梦 / 母亲 / 旅店</span></p>
    <div class="art-head-rule"></div>

  <article class="art-body">
      <p>我在外面旅游。什么地方不记得了，只记得是那种要排队的地方，队伍很长，绕了半圈。</p>
      <p>我看见了老妈。</p>
      <p>她站在队伍中间，穿着一件我认识的外套，侧对着我。我一下子松了口气——在这个人生地不熟的地方，看到熟悉的人，那种感觉就像捡到什么东西。</p>
      <p>我穿过去，想拍她肩膀，想喊一句：可找到你了。</p>
      <p>走近了才看清。</p>
      <p>她背后站着一个我。</p>
  </article>
