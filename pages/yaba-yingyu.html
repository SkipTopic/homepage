  <article class="art-body">

    <p>我有个观察：中国大学生的哑巴英语，不是因为不会说，是因为缺少练习的空间。</p>

    <p>我把这个观察拿去问了 AI，让它印证。</p>

    <p>它说，语言输出需要三个条件：安全感、可理解的输入、以及允许犯错的环境。课堂上很少同时具备这三样。</p>

    <p>它还给了几个具体场景：大班课上轮不到每个人开口；说错了会被同学笑；考试只考读写。</p>

    <p>这些我觉得对。</p>

    <p>但我的观察还是那一句：不是不会，是没地方说。</p>
  </article>
