    <title>跳过话题 · 对页书</title>
    <script>
      // 触屏/手机检测（UA + pointer + 短边）：命中就给 <html> 加 is-touch，
      // CSS 据此给触屏方案（hover 依赖降级、常显标签等）。桌面访客不受影响。
      (function () {
        var ua = navigator.userAgent || "";
        var mobileUA = /Android|iPhone|iPad|iPod|Mobile|HarmonyOS/i.test(ua);
        var coarse = !!(window.matchMedia && window.matchMedia("(pointer: coarse)").matches);
        var smallSide = Math.min(window.screen.width || 0, window.screen.height || 0);
        if (mobileUA || (coarse && smallSide < 500)) {
          document.documentElement.classList.add("is-touch");
        }
      })();
    </script>

  <body>
    <div class="book">

        <!-- 2026-11-25：左上标题＝回封面（站点首页）的入口，站主要求点这里能回门厅 -->

      <!-- 书脊 -->

      <!-- 右页：正文 -->

    <!-- 小火箭：回到最顶端。桌面时书页是「左右页各自滚动」，手机是整页滚动，
         所以两类容器都收进来，谁的 scrollTop > 0 就归零谁。 -->
    <script>
      (function () {
        var btn = document.getElementById("to-top");
        if (!btn) return;
        var BOXES = ".leaf-body, .page-right, .page-left, .book, .ial-wall, .aw-grid, .mw-film-grid";

        btn.addEventListener("click", function () {
          var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
          var behavior = reduce ? "auto" : "smooth";

          window.scrollTo({ top: 0, left: 0, behavior: behavior });

          var boxes = document.querySelectorAll(BOXES);
          for (var i = 0; i < boxes.length; i += 1) {
            if (boxes[i].scrollTop > 0) {
              boxes[i].scrollTo({ top: 0, left: 0, behavior: behavior });
            }
          }
        });
      })();
    </script>
